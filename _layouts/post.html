---
layout: default
---
<article>
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="meta">
    {{ page.date | date: "%B %-d, %Y" }}
    {% if page.topic %}
      {% assign t = site.topics | where: "name", page.topic | first %}
      · {% if t %}<a href="{{ '/topics/' | append: t.slug | append: '/' | relative_url }}">{{ page.topic }}</a>{% else %}{{ page.topic }}{% endif %}
    {% endif %}
  </p>
  <div class="post-body">
    {{ content }}
  </div>
</article>
