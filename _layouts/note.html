---
layout: default
---
{% comment %} The page for one note, opened with "Read more". {% endcomment %}
<main class="content">
  <a class="back" href="{{ '/notes/' | relative_url }}">← All notes</a>
  {% unless page.hide_title %}<h1 class="post-title">{{ page.title }}</h1>{% endunless %}
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  <div class="post-body">
    {{ content }}
  </div>
</main>
