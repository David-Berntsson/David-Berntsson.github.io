# Everything on the Articles & Books page comes from this file.
# Add new entries at the top of each list; they're shown in the order written here.
#
# A book looks like this (only title is required):
#
#   - title: Gödel, Escher, Bach
#     author: Douglas Hofstadter
#     status: reading          # "reading" puts it in the Now panel on About
#     read: 2026-11-01         # when you finished it (shown as "Read November 2026")
#     topic: Mathematics
#     note: One or two sentences on what stayed with you.
#     post: /posts/2026/11/my-post-about-it/   # optional link to a longer post
#
# An article looks like this:
#
#   - title: The article's title
#     source: Where it was published, or who wrote it
#     url: https://example.com/the-article
#     read: 2026-11-01
#     topic: Artificial Intelligence
#     note: Why it's worth reading.

# PLACEHOLDERS below: replace the [bracketed] text, or delete the entries.
books:
  - title: "[Book title]"
    author: "[Author]"
    status: reading
    topic: Mathematics
    note: "[One or two sentences on what stayed with you.]"
  - title: "[Book title]"
    author: "[Author]"
    read: 2026-11-01
    topic: "Literature & Philosophy"
    note: "[One or two sentences on what stayed with you.]"
    post: /posts/2026/11/welcome/

articles:
  - title: "[Article title]"
    source: "[Publication or author]"
    url: https://example.com
    read: 2026-11-01
    topic: Artificial Intelligence
    note: "[Why it's worth reading.]"
  - title: "[Article title]"
    source: "[Publication or author]"
    url: https://example.com
    read: 2026-10-01
    topic: Finance
    note: "[Why it's worth reading.]"
