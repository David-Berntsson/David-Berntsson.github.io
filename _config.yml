theme: jekyll-theme-minimal
title: David's homepage
description: Various thoughts and reflections
timezone: Europe/Stockholm

# The heading and line at the top of the Reflections & Writings sidebar.
writings_title: Working Thoughts
writings_description: Longer pieces on computer science, mathematics, AI, finance, philosophy and other things.
github_url: https://github.com/David-Berntsson
email: "[your email]"   # shown under Contact on the About page

plugins:
  - jekyll-seo-tag

# Post URLs look like /posts/2026/11/my-post-title/
permalink: /posts/:year/:month/:title/

# The sections in the bar at the top of every page, in order.
# "blurb" is the line shown under each section on the About page.
# "id" must match the `section:` of the pages that belong to it.
sections:
  - name: About me
    id: about
    url: /
  - name: "Reflections & Writings"
    id: writings
    url: /writings/
    blurb: "Longer posts on computer science, mathematics, AI, finance and more."
  - name: Projects
    id: projects
    url: /projects/
    blurb: "What I'm building, and the posts about each project."
  - name: "Articles & Books"
    id: reading
    url: /reading/
    blurb: "What I've been reading, with short notes."
  - name: Notes
    id: notes
    url: /notes/
    blurb: "Short, unpolished ideas and things I've learned."

# The topics listed in the Reflections & Writings sidebar.
# "name" must match the `topic:` you write at the top of each post.
topics:
  - name: Computer Science
    slug: computer-science
  - name: Mathematics
    slug: mathematics
  - name: Education
    slug: education
  - name: Artificial Intelligence
    slug: artificial-intelligence
  - name: Finance
    slug: finance
  - name: "Literature & Philosophy"
    slug: literature-philosophy
  - name: Other
    slug: other

# Each of these is a folder with one file per item, and each item gets its own page.
# Projects: _projects/ -> /projects/<file name>/
# Books and articles: _reading/ -> /reading/<file name>/
# Notes: _notes/ -> /notes/<file name without the date>/
collections:
  projects:
    output: true
    permalink: /projects/:name/
  reading:
    output: true
    permalink: /reading/:name/
  notes:
    output: true
    permalink: /notes/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: writings
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      section: projects
  - scope:
      path: ""
      type: reading
    values:
      layout: reading-item
      section: reading
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      section: notes
